name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TERMLOG_GOOGLE_CLIENT_ID: ${{ secrets.TERMLOG_GOOGLE_CLIENT_ID }}
  TERMLOG_GOOGLE_CLIENT_SECRET: ${{ secrets.TERMLOG_GOOGLE_CLIENT_SECRET }}
  TERMLOG_RECEIPT_SECRET: ${{ secrets.TERMLOG_RECEIPT_SECRET }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [default, msrv]

    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Setup Nix cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.rust }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.rust }}-

      - name: Build
        run: nix develop .#${{ matrix.rust }} --command cargo build --locked --verbose

      - name: Run cargo tests
        run: nix develop .#${{ matrix.rust }} --command cargo test --locked --verbose

      - name: Run integration tests
        run: nix develop .#${{ matrix.rust }} --command tests/integration.sh

      - name: Check formatting
        run: nix develop .#${{ matrix.rust }} --command cargo fmt --check

      - name: Lint with clippy
        run: nix develop .#${{ matrix.rust }} --command cargo clippy --locked
